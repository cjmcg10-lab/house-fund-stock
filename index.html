<style>
html{-webkit-text-size-adjust:100%}
body{margin:0}
[hidden]{display:none!important}
/* Layout: one phone-width column, status strip on top, five-tab bar fixed at the bottom. */
:root{
  --bg:#f4f2f1; --surface:#ffffff; --sunk:#ebe7e5; --ink:#1e1a19; --muted:#6a6260; --line:#ded7d4;
  --accent:#b3261e; --accent-ink:#ffffff; --accent-soft:#f7e3e0;
  --good:#1c7448; --good-soft:#dff1e7; --warn:#8a5200; --warn-soft:#fbecd0;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#161312; --surface:#211c1b; --sunk:#2b2523; --ink:#f2ecea; --muted:#a79d9a; --line:#3a3230;
  --accent:#ff7265; --accent-ink:#240806; --accent-soft:#3d1c18;
  --good:#63d39a; --good-soft:#173527; --warn:#f2b659; --warn-soft:#3a2a0e; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#161312; --surface:#211c1b; --sunk:#2b2523; --ink:#f2ecea; --muted:#a79d9a; --line:#3a3230;
  --accent:#ff7265; --accent-ink:#240806; --accent-soft:#3d1c18;
  --good:#63d39a; --good-soft:#173527; --warn:#f2b659; --warn-soft:#3a2a0e; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;
  padding-inline:16px;padding-block:0 calc(92px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:680px;margin-inline:auto;display:flex;flex-direction:column;gap:16px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

header.top{padding-block:18px 0;display:flex;flex-direction:column;gap:10px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
h1{font-family:var(--display);font-weight:700;font-size:34px;line-height:1;margin:0;text-transform:uppercase;letter-spacing:.01em}
h2{font-family:var(--display);font-weight:700;font-size:24px;line-height:1.1;margin:0;text-transform:uppercase;text-wrap:balance}
h3{font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.num{font-variant-numeric:tabular-nums}

.status{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:10px 12px;border-radius:8px;background:var(--sunk);font-size:14px}
.status b{font-weight:600}
.status.due{background:var(--warn-soft);color:var(--warn)}
.status.due .muted{color:var(--warn)}

.note{padding:12px 14px;border-radius:8px;font-size:15px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.good{background:var(--good-soft);color:var(--good)}
.note.plain{background:var(--sunk)}

.head{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;justify-content:space-between}
.group{display:flex;flex-direction:column;gap:6px}
.group > h3{display:flex;justify-content:space-between;gap:12px;padding-inline:2px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row{display:flex;gap:12px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.row .name{font-weight:600;overflow-wrap:anywhere}
.row .sub{font-size:13.5px;color:var(--muted)}
.qty{font-family:var(--display);font-weight:700;font-size:26px;line-height:1;min-width:2ch;text-align:right;font-variant-numeric:tabular-nums}
.qty small{font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted);display:block;text-align:right;letter-spacing:.04em;text-transform:uppercase}

.step{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg);flex:none}
.step button{width:42px;height:42px;border:0;background:transparent;font-size:22px;line-height:1;color:var(--ink)}
.step button:active{background:var(--sunk)}
.step input{width:48px;border:0;border-inline:1px solid var(--line);background:var(--surface);text-align:center;font-weight:600;font-size:18px;font-variant-numeric:tabular-nums;padding:0;border-radius:0}
.same{border:1px dashed var(--line);background:transparent;border-radius:6px;padding:2px 8px;font-size:13px;color:var(--muted);align-self:flex-start;margin-top:3px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:11px 16px;font-weight:600;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.wide{width:100%}
.btn.sm{padding:6px 12px;min-height:34px;font-size:14px}
.btn.danger{color:var(--accent);border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.actions{display:flex;flex-wrap:wrap;gap:8px}

.pill{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pills{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}

.field{display:flex;flex-direction:column;gap:4px;flex:1 1 150px;min-width:0}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;min-height:44px;width:100%}
.form{display:flex;flex-wrap:wrap;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.form .actions{flex-basis:100%}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.savebar{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:5}
.savebar .btn{box-shadow:0 4px 14px rgba(0,0,0,.18)}

details.fold > summary{cursor:pointer;font-weight:600;padding:8px 2px;color:var(--muted)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:right;padding:6px 8px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;border-top:0}
.logrow{flex-direction:column;align-items:stretch;gap:10px}
.logrow .toprow{display:flex;gap:12px;align-items:center;background:transparent;border:0;padding:0;text-align:left;width:100%}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
nav.tabs .inner{display:flex;width:100%;max-width:680px}
nav.tabs button{flex:1;min-width:0;border:0;background:transparent;padding:8px 2px;border-radius:8px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:20;max-width:calc(100% - 32px);text-align:center}
body{padding-top:env(safe-area-inset-top,0px);-webkit-tap-highlight-color:transparent}
</style>
</head>

<script>
(function(){
'use strict';

/*LOGIC-START*/
function toUTC(s){ var p=String(s).split('-').map(Number); return Date.UTC(p[0],p[1]-1,p[2]); }
function daysBetween(a,b){ return Math.round((toUTC(b)-toUTC(a))/864e5); }
function addDays(s,n){ return new Date(toUTC(s)+n*864e5).toISOString().slice(0,10); }
function sortChecks(list){ return list.slice().sort(function(a,b){ return a.date<b.date?-1:a.date>b.date?1:(a.createdAt||0)-(b.createdAt||0); }); }
function buyQty(item, check){ var c=check&&check.counts?check.counts[item.id]:undefined; return typeof c==='number'?Math.max(0,item.target-c):null; }
// One interval per pair of checks: used = last count + what was bought after it - new count.
function usage(id, checks){
  var out=[], flagged=0;
  for(var i=1;i<checks.length;i++){
    var p=checks[i-1], c=checks[i], a=p.counts?p.counts[id]:undefined, b=c.counts?c.counts[id]:undefined;
    if(typeof a!=='number'||typeof b!=='number') continue;
    var days=daysBetween(p.date,c.date); if(days<=0) continue;
    var bought=(p.bought&&typeof p.bought[id]==='number')?p.bought[id]:0;
    var used=a+bought-b;
    if(used<0){ flagged++; continue; }
    out.push({days:days,used:used,end:b,to:c.date,checkId:c.id});
  }
  return {list:out,flagged:flagged};
}
function plan(item, checks, cycle){
  var u=usage(item.id,checks), recent=u.list.slice(-6), n=recent.length, days=0, used=0;
  recent.forEach(function(x){ days+=x.days; used+=x.used; });
  var per=days?used/days*cycle:0;
  var ranOut=recent.slice(-3).some(function(x){ return x.end===0&&x.used>0; });
  var suggest=null;
  if(n>=2){
    var t=Math.max(1,Math.ceil(per*1.25));
    if(ranOut) t=Math.max(t,Math.ceil(per*1.5));
    if(t>item.target) suggest=t; else if(t<item.target&&n>=3&&!ranOut) suggest=t;
  }
  return {n:n,per:per,steady:Math.round(per),ranOut:ranOut,suggest:suggest,flagged:u.flagged};
}
/*LOGIC-END*/

var MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function $(s){ return document.querySelector(s); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function today(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmt(s){ if(!s) return ''; var p=s.split('-').map(Number); return MONTHS[p[1]-1]+' '+p[2]+(String(p[0])!==today().slice(0,4)?', '+p[0]:''); }
function plural(n,w){ return n+' '+w+(n===1?'':'s'); }
function cycleWord(n){ return n===7?'week':n===14?'2 weeks':n===30?'month':n+' days'; }
function lsGet(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }

var db=null;
var S={ ready:false, noDb:false, items:[], checks:[], cycle:30, tab:'buy', canWrite:true, uid:null,
        draft:{date:today(),counts:{}}, buyAdj:{}, buyEdit:false, openLog:null, edit:null, confirm:null, dirty:false, me:'', noDbMsg:'', code:'' };
var savedName=lsGet('hfs-name'); if(typeof savedName==='string') S.me=savedName;
function nameField(){ return '<div class="field"><label for="me-name">Your name</label><input id="me-name" value="'+esc(S.me)+'" autocomplete="given-name" placeholder="So the log shows who did it"></div>'; }
var saved=lsGet('hfs-draft'); if(saved&&saved.counts) S.draft={date:saved.date||today(),counts:saved.counts};

function activeItems(){ return S.items.filter(function(i){ return !i.archived; }).sort(function(a,b){ return (a.order||0)-(b.order||0)||a.name.localeCompare(b.name); }); }
function checks(){ return sortChecks(S.checks); }
function latest(){ var c=checks(); return c[c.length-1]||null; }
function groupBy(list,key){ var m=[],ix={}; list.forEach(function(x){ var k=x[key]||'Other'; if(!(k in ix)){ ix[k]=m.length; m.push({key:k,rows:[]}); } m[ix[k]].rows.push(x); }); return m; }
function who(name){ return esc(name||'someone'); }

function toast(t){ var el=$('#toast'); el.textContent=t; el.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(function(){ el.hidden=true; },2600); }

function stepper(kind,id,val,label){
  return '<div class="step"><button type="button" data-act="dec" data-kind="'+kind+'" data-id="'+esc(id)+'" aria-label="One less '+esc(label)+'">&minus;</button>'+
    '<input id="'+kind+'-'+esc(id)+'" data-kind="'+kind+'" data-id="'+esc(id)+'" inputmode="numeric" pattern="[0-9]*" autocomplete="off" value="'+esc(val)+'" aria-label="'+esc(label)+'">'+
    '<button type="button" data-act="inc" data-kind="'+kind+'" data-id="'+esc(id)+'" aria-label="One more '+esc(label)+'">+</button></div>';
}

/* ---------- status strip ---------- */
function renderStatus(){
  var el=$('#status'), l=latest();
  if(S.noDb){ el.className='status'; el.innerHTML='<span>'+esc(S.noDbMsg||'Could not load the stock list. Check your connection, then reload.')+'</span>'; return; }
  if(!S.code){ el.className='status'; el.innerHTML='<span>Enter your crew code to open the list.</span>'; return; }
  if(!S.ready){ return; }
  if(!l){ el.className='status'; el.innerHTML='<span>'+(S.items.length?'No checks yet. Do the first count on the Check tab.':'No items yet.')+'</span>'; return; }
  var ago=daysBetween(l.date,today()), due=addDays(l.date,S.cycle), over=daysBetween(due,today());
  var agoTxt=ago<=0?'today':ago===1?'yesterday':ago+' days ago';
  if(over>=0){ el.className='status due'; el.innerHTML='<b>'+(over===0?'Check due today':'Check overdue by '+plural(over,'day'))+'</b><span class="muted">Last check '+fmt(l.date)+', '+agoTxt+'</span>'; }
  else { el.className='status'; el.innerHTML='<span><b>Last check</b> '+fmt(l.date)+', '+agoTxt+'</span><span class="muted">Next due '+fmt(due)+'</span>'; }
}

/* ---------- Buy ---------- */
function buyDefault(item,l){ if(l.bought&&typeof l.bought[item.id]==='number') return l.bought[item.id]; return buyQty(item,l)||0; }
function buyVal(item,l){ return (item.id in S.buyAdj)?S.buyAdj[item.id]:buyDefault(item,l); }
function viewBuy(){
  var l=latest();
  if(!l) return '<div class="note plain"><b>Nothing to buy yet</b><span>The shopping list appears after the first check. Go to the Check tab and count what is on the shelf.</span></div>';
  var items=activeItems(), need=[], stocked=[], skipped=[];
  items.forEach(function(it){ var q=buyQty(it,l); if(q===null) skipped.push(it); else if(q>0||(l.bought&&l.bought[it.id]>0)) need.push(it); else stocked.push(it); });
  var done=!!l.bought, editing=S.canWrite&&(!done||S.buyEdit);
  var total=0; need.concat(editing?stocked:[]).forEach(function(it){ total+=Number(buyVal(it,l))||0; });
  var out='<div class="head"><h2>Shopping list</h2><span class="muted small">From the '+fmt(l.date)+' check</span></div>';
  if(done&&!S.buyEdit) out+='<div class="note good"><span><b>Bought '+fmt(l.boughtDate)+'</b> by '+who(l.boughtBy)+'. Next check due '+fmt(addDays(l.date,S.cycle))+'.</span>'+(S.canWrite?'<button class="btn sm" data-act="buy-edit">Change what was bought</button>':'')+'</div>';
  if(!need.length) out+='<div class="note plain"><span>Everything counted is at or above its stock number. Nothing to buy.</span></div>';
  groupBy(need,'store').forEach(function(g){
    out+='<section class="group"><h3><span>'+esc(g.key)+'</span><span>'+plural(g.rows.length,'item')+'</span></h3><div class="list">';
    g.rows.forEach(function(it){
      var c=l.counts[it.id];
      out+='<div class="row"><div class="main"><span class="name">'+esc(it.name)+'</span><span class="sub">'+(it.pack?esc(it.pack)+' · ':'')+'have '+c+' of '+it.target+'</span></div>'+
        (editing?stepper('buy',it.id,buyVal(it,l),'to buy, '+it.name):'<div class="qty">'+buyVal(it,l)+'<small>'+(done?'bought':'buy')+'</small></div>')+'</div>';
    });
    out+='</div></section>';
  });
  if(editing&&(need.length||stocked.length)) out+='<div class="form">'+nameField()+'</div><div class="savebar"><button class="btn primary wide" data-act="buy-save">'+(done?'Save changes':'Mark as bought')+' ('+plural(total,'unit')+')</button></div>'+
    '<p class="muted small">Change a number if you bought more or less than the list says. The next check uses what was bought to work out how much got used.</p>';
  if(stocked.length){
    out+='<details class="fold"><summary>Already stocked ('+stocked.length+')</summary><div class="list">';
    stocked.forEach(function(it){ var c=l.counts[it.id], over=c-it.target;
      out+='<div class="row"><div class="main"><span class="name">'+esc(it.name)+'</span><span class="sub">have '+c+' of '+it.target+(over>0?' · over by '+over:'')+'</span></div>'+(editing?stepper('buy',it.id,buyVal(it,l),'bought, '+it.name):'')+'</div>'; });
    out+='</div></details>';
  }
  if(skipped.length) out+='<p class="muted small">Not counted in this check: '+skipped.map(function(i){ return esc(i.name); }).join(', ')+'.</p>';
  return out;
}

/* ---------- Check ---------- */
function countedN(){ var n=0; activeItems().forEach(function(it){ var v=S.draft.counts[it.id]; if(v!==undefined&&v!==''&&isFinite(Number(v))) n++; }); return n; }
function sinceText(){ var l=latest(); if(!l) return 'This will be the first check.'; var d=daysBetween(l.date,S.draft.date);
  return d>0?plural(d,'day')+' since the last check on '+fmt(l.date)+'.':d===0?'Same day as the last check ('+fmt(l.date)+').':'This date is before the last check on '+fmt(l.date)+'.'; }
function viewCheck(){
  var l=latest(), items=activeItems();
  if(!S.canWrite) return '<div class="note plain"><span>You can view this list but not record checks. Ask the owner to give you Contributor access.</span></div>';
  var out='<div class="head"><h2>New check</h2></div>'+
    '<div class="form"><div class="field"><label for="check-date">Date of this check</label><input type="date" id="check-date" value="'+esc(S.draft.date)+'" max="'+today()+'"></div>'+
    nameField()+'<p class="small muted" id="since" style="flex-basis:100%">'+esc(sinceText())+'</p></div>';
  if(l&&!l.bought&&items.some(function(it){ return buyQty(it,l)>0; }))
    out+='<div class="note warn"><span><b>The '+fmt(l.date)+' shopping list is not marked as bought.</b> Mark it first so this check can tell what was used from what was restocked.</span><button class="btn sm" data-tab="buy">Go to Buy</button></div>';
  groupBy(items,'cat').forEach(function(g){
    out+='<section class="group"><h3>'+esc(g.key)+'</h3><div class="list">';
    g.rows.forEach(function(it){
      var last=l&&typeof l.counts[it.id]==='number'?l.counts[it.id]:null, v=S.draft.counts[it.id]; if(v===undefined) v='';
      out+='<div class="row"><div class="main"><span class="name">'+esc(it.name)+'</span><span class="sub">Stock number '+it.target+(it.pack?' · '+esc(it.pack):'')+'</span>'+
        (last!==null?'<button type="button" class="same" data-act="same" data-id="'+esc(it.id)+'" data-v="'+last+'">Last time: '+last+'</button>':'')+'</div>'+stepper('c',it.id,v,'count, '+it.name)+'</div>';
    });
    out+='</div></section>';
  });
  out+='<div class="savebar"><button class="btn primary wide" data-act="check-save" id="check-save">Save check ('+countedN()+' of '+items.length+' counted)</button></div>'+
    '<p class="muted small">Leave an item blank to skip it. Tap “Last time” if the count has not changed.</p>';
  return out;
}

/* ---------- Plan ---------- */
function viewPlan(){
  var cs=checks(), items=activeItems(), w=cycleWord(S.cycle);
  var rows=items.map(function(it){ return {it:it,p:plan(it,cs,S.cycle)}; });
  var out='<div class="head"><h2>Purchasing plan</h2><span class="muted small">Based on a check every '+w+'</span></div>';
  if(!rows.some(function(r){ return r.p.n>0; })){
    return out+'<div class="note plain"><b>Not enough history yet</b><span>The plan compares one check to the next. There '+(cs.length===1?'is 1 check':'are '+cs.length+' checks')+' logged so far.</span>'+
      '<span>After the second check, each item shows how much was used. After the third, it suggests a steady amount to buy each trip and whether a stock number should go up or down.</span></div>';
  }
  rows.sort(function(a,b){ return (b.p.suggest!==null)-(a.p.suggest!==null)||b.p.per-a.p.per; });
  out+='<div class="list">';
  rows.forEach(function(r){ var it=r.it,p=r.p, pills='', sub;
    if(p.n===0) sub='No usable history yet';
    else { var per=p.per<0.05?0:p.per; sub='Uses about '+(per>=10?Math.round(per):Math.round(per*10)/10)+' a '+w+(p.n<3?' (early read)':''); }
    if(p.n<3) pills+='<span class="pill">Learning · '+p.n+' of 3</span>';
    if(p.ranOut) pills+='<span class="pill warn">Ran out</span>';
    if(p.suggest!==null) pills+='<span class="pill warn">'+(p.suggest>it.target?'Raise':'Lower')+' stock number '+it.target+' → '+p.suggest+'</span>';
    else if(p.n>=3) pills+='<span class="pill good">Stock number fits</span>';
    if(p.flagged) pills+='<span class="pill">'+plural(p.flagged,'check')+' skipped: count rose with no purchase logged</span>';
    out+='<div class="row"><div class="main"><span class="name">'+esc(it.name)+'</span><span class="sub">'+sub+'</span><div class="pills">'+pills+'</div>'+
      (p.suggest!==null&&S.canWrite?'<div class="actions" style="margin-top:6px"><button class="btn sm" data-act="apply" data-id="'+esc(it.id)+'" data-v="'+p.suggest+'">Set to '+p.suggest+'</button></div>':'')+'</div>'+
      '<div class="qty">'+(p.n>=1?p.steady:'–')+'<small>per trip</small></div></div>';
  });
  return out+'</div><p class="muted small">“Per trip” is the average used between checks, which is what to expect to buy each time. Suggested stock numbers add a quarter on top as a cushion, or a half for items that ran out.</p>';
}

/* ---------- Log ---------- */
function viewLog(){
  var cs=checks(), items=S.items, out='<div class="head"><h2>Check log</h2><span class="muted small">'+plural(cs.length,'check')+'</span></div>';
  if(!cs.length) return out+'<div class="note plain"><span>Every saved check is listed here with who did it and what was counted.</span></div>';
  out+='<div class="list">';
  for(var i=cs.length-1;i>=0;i--){ var c=cs[i], prev=cs[i-1], n=Object.keys(c.counts||{}).length, open=S.openLog===c.id;
    out+='<div class="row logrow"><button class="toprow" data-act="log-open" data-id="'+esc(c.id)+'" aria-expanded="'+open+'"><div class="main"><span class="name">'+fmt(c.date)+'</span>'+
      '<span class="sub">'+(c.by?'By '+who(c.by)+' · ':'')+plural(n,'item')+' counted'+(prev?' · '+plural(daysBetween(prev.date,c.date),'day')+' after the last one':'')+'</span></div>'+
      '<span class="pill '+(c.bought?'good':'')+'">'+(c.bought?'Bought':'Not bought yet')+'</span></button>';
    if(open){
      out+='<div class="tablewrap"><table><thead><tr><th>Item</th><th>Count</th><th>Used</th><th>Bought</th></tr></thead><tbody>';
      items.forEach(function(it){ var v=c.counts?c.counts[it.id]:undefined; if(typeof v!=='number') return;
        var u=usage(it.id,prev?[prev,c]:[c]).list[0];
        out+='<tr><td>'+esc(it.name)+'</td><td>'+v+'</td><td>'+(u?u.used:'–')+'</td><td>'+(c.bought&&typeof c.bought[it.id]==='number'?c.bought[it.id]:'–')+'</td></tr>'; });
      out+='</tbody></table></div>';
      if(S.canWrite) out+='<div class="actions"><button class="btn sm danger" data-act="log-del" data-id="'+esc(c.id)+'">'+(S.confirm==='log-'+c.id?'Tap again to delete this check':'Delete check')+'</button></div>';
    }
    out+='</div>';
  }
  return out+'</div>';
}

/* ---------- Items ---------- */
function opts(key){ var seen={}; return S.items.map(function(i){ return i[key]; }).filter(function(v){ if(!v||seen[v]) return false; seen[v]=1; return true; }); }
function itemForm(it){
  var isNew=!it.id;
  return '<div class="form" id="item-form"><div class="field" style="flex-basis:100%"><label for="f-name">Item name</label><input id="f-name" value="'+esc(it.name||'')+'"></div>'+
    '<div class="field"><label for="f-target">Stock number</label><input id="f-target" inputmode="numeric" pattern="[0-9]*" value="'+esc(it.target==null?'':it.target)+'"></div>'+
    '<div class="field"><label for="f-pack">Packaging</label><input id="f-pack" value="'+esc(it.pack||'')+'" placeholder="Case of 4"></div>'+
    '<div class="field"><label for="f-cat">Category</label><input id="f-cat" list="dl-cat" value="'+esc(it.cat||'')+'"></div>'+
    '<div class="field"><label for="f-store">Store</label><input id="f-store" list="dl-store" value="'+esc(it.store||'')+'"></div>'+
    '<datalist id="dl-cat">'+opts('cat').map(function(v){ return '<option value="'+esc(v)+'">'; }).join('')+'</datalist>'+
    '<datalist id="dl-store">'+opts('store').map(function(v){ return '<option value="'+esc(v)+'">'; }).join('')+'</datalist>'+
    '<div class="actions"><button class="btn primary" data-act="item-save">'+(isNew?'Add item':'Save')+'</button><button class="btn" data-act="item-cancel">Cancel</button>'+
    (isNew?'':'<button class="btn danger" data-act="item-del">'+(S.confirm==='item-'+it.id?'Tap again to remove':'Remove item')+'</button>')+'</div></div>';
}
function viewItems(){
  var items=activeItems(), out='<div class="head"><h2>How often you check</h2></div><div class="seg" role="group" aria-label="Check schedule">';
  [[7,'Every week'],[14,'Every 2 weeks'],[30,'Every month']].forEach(function(o){ out+='<button data-act="cycle" data-v="'+o[0]+'" aria-pressed="'+(S.cycle===o[0])+'"'+(S.canWrite?'':' disabled')+'>'+o[1]+'</button>'; });
  out+='</div><p class="muted small">This sets when the next check is due and the time span the plan is worked out for.</p>'+
    '<div class="head"><h2>Items</h2><span class="muted small">'+items.length+' tracked</span></div>';
  if(S.canWrite) out+=(S.edit&&S.edit.isNew?itemForm({}):'<div class="actions"><button class="btn" data-act="item-new">Add an item</button></div>');
  if(!items.length) out+='<div class="note plain"><span>No items yet. Add the first one with its stock number, the amount you want on the shelf after a shopping trip.</span></div>';
  groupBy(items,'cat').forEach(function(g){
    out+='<section class="group"><h3>'+esc(g.key)+'</h3><div class="list">';
    g.rows.forEach(function(it){
      if(S.edit&&S.edit.id===it.id){ out+='<div class="row" style="padding:0">'+itemForm(it).replace('class="form"','class="form" style="border:0;border-radius:0;width:100%"')+'</div>'; return; }
      out+='<div class="row"><div class="main"><span class="name">'+esc(it.name)+'</span><span class="sub">'+[it.pack,it.store].filter(Boolean).map(esc).join(' · ')+'</span></div>'+
        '<div class="qty">'+it.target+'<small>stock</small></div>'+(S.canWrite?'<button class="btn sm" data-act="item-edit" data-id="'+esc(it.id)+'">Edit</button>':'')+'</div>';
    });
    out+='</div></section>';
  });
  return out;
}

/* ---------- render ---------- */
function cleanCode(v){ return String(v||'').trim().toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9_-]/g,'').slice(0,40); }
function C(n){ return db.collection('houses').doc(S.code).collection(n); }
function codeForm(){
  return '<div class="head"><h2>Crew code</h2></div><div class="form"><div class="field" style="flex-basis:100%"><label for="code-in">Type the code your crew shares</label>'+
    '<input id="code-in" autocapitalize="none" autocorrect="off" autocomplete="off" spellcheck="false"></div>'+
    '<div class="actions"><button class="btn primary" data-act="code-save">Open the list</button></div>'+
    '<p class="muted small" style="flex-basis:100%">Everyone who types the same code sees the same list and log. You only type it once on this phone.</p></div>';
}
function seedPrompt(){
  if(S.items.length||S.checks.length||!window.HFS_SEED) return '';
  return '<div class="note plain"><b>No list found for the code “'+esc(S.code)+'”</b><span>If your crew already has a list, the code was probably typed differently. Check it and try again.</span>'+
    '<button class="btn" data-act="code-change">Try a different code</button></div>'+
    '<div class="note plain"><b>Starting fresh?</b><span>This loads the house fund list under this code: '+window.HFS_SEED.items.length+' items with their stock numbers, plus the '+fmt(window.HFS_SEED.check.date)+' count as the first check.</span>'+
    '<button class="btn primary" data-act="seed">Start a new list with this code</button></div>';
}
function render(){
  renderStatus();
  document.querySelectorAll('nav.tabs button').forEach(function(b){ if(b.dataset.tab===S.tab) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
  var v=$('#view');
  if(S.noDb){ v.innerHTML=''; return; }
  if(!S.code){ v.innerHTML=codeForm(); return; }
  if(!S.ready){ v.innerHTML='<div class="note plain"><span>Items, counts and the shopping list will appear here in a moment.</span></div>'; return; }
  var sp=seedPrompt();
  v.innerHTML=sp&&S.tab!=='items'?sp:{buy:viewBuy,check:viewCheck,plan:viewPlan,log:viewLog,items:viewItems}[S.tab]();
  if(S.tab==='items') v.innerHTML+='<div class="note plain"><span>Crew code: <b>'+esc(S.code)+'</b>. Anyone who has this code can see and change the list, so share it only with the crew.</span><button class="btn sm" data-act="code-change">Use a different code</button></div>';
}
function busyInput(){ var a=document.activeElement; return !!(a&&a.tagName==='INPUT'&&$('#view').contains(a)); }
function softRender(){ if(busyInput()||S.edit){ S.dirty=true; renderStatus(); } else render(); }
function fail(e){ toast(e&&e.code==='permission-denied'?'The database refused that. Check the Firestore rules.':'That did not save. Try again.'); }
function slow(p,btn){ var t=setTimeout(function(){ toast('Still saving. Check your connection.'); },8000);
  return p.then(function(x){ clearTimeout(t); return x; },function(e){ clearTimeout(t); if(btn) btn.disabled=false; throw e; }); }

/* ---------- actions ---------- */
function num(v){ var n=parseInt(v,10); return isFinite(n)&&n>=0?n:null; }
function setTab(t){ S.tab=t; S.confirm=null; S.edit=null; S.dirty=false; render(); window.scrollTo(0,0); }
function bump(kind,id,d){
  var el=document.getElementById(kind+'-'+id); if(!el) return; var cur=num(el.value), n=cur===null?(d>0?1:0):Math.max(0,cur+d);
  el.value=n; store(kind,id,String(n));
}
function store(kind,id,v){
  if(kind==='c'){ if(v==='') delete S.draft.counts[id]; else S.draft.counts[id]=v; lsSet('hfs-draft',S.draft);
    var b=$('#check-save'); if(b) b.textContent='Save check ('+countedN()+' of '+activeItems().length+' counted)'; }
  else if(kind==='buy'){ S.buyAdj[id]=num(v)||0; var l=latest(), t=0; activeItems().forEach(function(it){ if(buyQty(it,l)!==null) t+=Number(buyVal(it,l))||0; });
    var s=document.querySelector('[data-act="buy-save"]'); if(s) s.textContent=(l.bought?'Save changes':'Mark as bought')+' ('+plural(t,'unit')+')'; }
}
function needName(){ if((S.me||'').trim()) return false; toast('Type your name first.'); var el=$('#me-name'); if(el) el.focus(); return true; }
function saveCheck(btn){
  var counts={}; activeItems().forEach(function(it){ var n=num(S.draft.counts[it.id]); if(n!==null&&S.draft.counts[it.id]!=='') counts[it.id]=n; });
  if(needName()) return;
  if(!Object.keys(counts).length){ toast('Count at least one item first.'); return; }
  if(!/^\d{4}-\d{2}-\d{2}$/.test(S.draft.date)){ toast('Pick the date of this check.'); return; }
  btn.disabled=true;
  slow(C('checks').add({date:S.draft.date,by:S.me.trim().slice(0,40),counts:counts,bought:null,createdAt:Date.now()}),btn).then(function(){
    S.draft={date:today(),counts:{}}; lsSet('hfs-draft',S.draft); S.buyAdj={}; S.buyEdit=false; setTab('buy'); toast('Check saved. Here is what to buy.');
  }).catch(fail);
}
function saveBought(btn){
  var l=latest(); if(!l||needName()) return; var bought={};
  activeItems().forEach(function(it){ if(buyQty(it,l)===null) return; bought[it.id]=Number(buyVal(it,l))||0; });
  btn.disabled=true;
  slow(C('checks').doc(l.id).update({bought:bought,boughtDate:l.boughtDate||today(),boughtBy:l.boughtBy||S.me.trim().slice(0,40)}),btn)
    .then(function(){ S.buyAdj={}; S.buyEdit=false; render(); toast('Marked as bought.'); }).catch(fail);
}
function saveItem(btn){
  var name=$('#f-name').value.trim().slice(0,80), target=num($('#f-target').value);
  if(!name){ toast('Give the item a name.'); return; } if(target===null){ toast('Enter a stock number, 0 or more.'); return; }
  var body={name:name,target:target,pack:$('#f-pack').value.trim().slice(0,40),cat:$('#f-cat').value.trim().slice(0,40)||'Miscellaneous',store:$('#f-store').value.trim().slice(0,40)||'Wholesale'};
  var p; btn.disabled=true;
  if(S.edit.isNew){ body.order=S.items.reduce(function(m,i){ return Math.max(m,i.order||0); },0)+1; body.archived=false; p=C('items').add(body); }
  else p=C('items').doc(S.edit.id).update(body);
  slow(p,btn).then(function(){ S.edit=null; S.dirty=false; render(); toast('Saved.'); }).catch(fail);
}
function loadSeed(btn){
  var seed=window.HFS_SEED, batch=db.batch(); btn.disabled=true;
  seed.items.forEach(function(it){ var o=Object.assign({},it); delete o.id; batch.set(C('items').doc(it.id),o); });
  batch.set(C('checks').doc('check-'+seed.check.date),{date:seed.check.date,by:'',counts:seed.check.counts,bought:null,createdAt:Date.now()});
  batch.set(C('config').doc('settings'),{cycleDays:30});
  slow(batch.commit(),btn).then(function(){ toast('List loaded.'); }).catch(fail);
}

document.addEventListener('click',function(e){
  var t=e.target.closest('[data-tab]'); if(t){ setTab(t.dataset.tab); return; }
  var b=e.target.closest('[data-act]'); if(!b||b.tagName==='INPUT') return;
  var a=b.dataset.act, id=b.dataset.id;
  if(a==='inc'||a==='dec'){ bump(b.dataset.kind,id,a==='inc'?1:-1); return; }
  if(a==='same'){ var el=document.getElementById('c-'+id); if(el){ el.value=b.dataset.v; store('c',id,b.dataset.v); } return; }
  if(!db) return;
  if(a==='code-save'){ var c=cleanCode($('#code-in').value); if(c.length<8){ toast('Use at least 8 letters or numbers.'); return; } S.code=c; lsSet('hfs-code',c); return connect(); }
  if(a==='code-change'){ S.code=''; lsSet('hfs-code',''); unsubs.forEach(function(u){ u(); }); unsubs=[]; S.ready=false; S.items=[]; S.checks=[]; S.tab='buy'; return render(); }
  if(!S.code) return;
  if(a==='seed') return loadSeed(b);
  if(a==='check-save') return saveCheck(b);
  if(a==='buy-save') return saveBought(b);
  if(a==='buy-edit'){ S.buyEdit=true; S.buyAdj={}; return render(); }
  if(a==='apply'){ b.disabled=true; return slow(C('items').doc(id).update({target:Number(b.dataset.v)}),b).then(function(){ toast('Stock number updated.'); }).catch(fail); }
  if(a==='cycle'){ var v=Number(b.dataset.v); S.cycle=v; render(); return C('config').doc('settings').set({cycleDays:v}).catch(fail); }
  if(a==='log-open'){ S.openLog=S.openLog===id?null:id; S.confirm=null; return render(); }
  if(a==='log-del'){ if(S.confirm!=='log-'+id){ S.confirm='log-'+id; return render(); } S.confirm=null; return C('checks').doc(id).delete().then(function(){ toast('Check deleted.'); }).catch(fail); }
  if(a==='item-new'){ S.edit={isNew:true}; S.confirm=null; return render(); }
  if(a==='item-edit'){ S.edit={id:id}; S.confirm=null; return render(); }
  if(a==='item-cancel'){ S.edit=null; S.dirty=false; return render(); }
  if(a==='item-save') return saveItem(b);
  if(a==='item-del'){ var k='item-'+S.edit.id; if(S.confirm!==k){ S.confirm=k; return render(); } S.confirm=null; var rid=S.edit.id; S.edit=null; S.dirty=false; render();
    return C('items').doc(rid).update({archived:true}).then(function(){ toast('Item removed. Its history is kept.'); }).catch(fail); }
});
document.addEventListener('input',function(e){
  var el=e.target;
  if(el.id==='me-name'){ S.me=el.value; lsSet('hfs-name',S.me); return; }
  if(el.id==='check-date'){ S.draft.date=el.value; lsSet('hfs-draft',S.draft); var s=$('#since'); if(s&&el.value) s.textContent=sinceText(); return; }
  if(el.dataset&&el.dataset.kind){ var v=el.value.replace(/[^0-9]/g,''); if(v!==el.value) el.value=v; store(el.dataset.kind,el.dataset.id,v); }
});
document.addEventListener('focusout',function(){ setTimeout(function(){ if(S.dirty&&!busyInput()&&!S.edit){ S.dirty=false; render(); } },0); });

/* ---------- boot ---------- */
var got={items:false,checks:false}, unsubs=[];
function arrived(k){ got[k]=true; if(got.items&&got.checks) S.ready=true; softRender(); }
function docs(snap){ return snap.docs.map(function(d){ var o=Object.assign({},d.data()); o.id=d.id; return o; }); }
function dead(e){ S.noDb=true; S.noDbMsg=e&&e.code==='permission-denied'?'The database is refusing to share the list. The Firestore rules need to be published.':''; render(); }
function connect(){
  unsubs.forEach(function(u){ u(); }); unsubs=[]; got={items:false,checks:false}; S.ready=false; S.items=[]; S.checks=[]; S.cycle=30; render();
  unsubs.push(C('items').onSnapshot(function(s){ S.items=docs(s).map(function(i){ i.target=Number(i.target)||0; return i; }).sort(function(a,b){ return (a.order||0)-(b.order||0); }); arrived('items'); },dead));
  unsubs.push(C('checks').onSnapshot(function(s){ S.checks=docs(s).filter(function(c){ return c.date&&c.counts; }); arrived('checks'); },dead));
  unsubs.push(C('config').doc('settings').onSnapshot(function(s){ var v=s.exists?Number(s.data().cycleDays):0; if(v>0){ S.cycle=v; softRender(); } },function(){}));
}
var fromLink=cleanCode(decodeURIComponent((location.hash||'').slice(1)));
if(fromLink.length>=8){ S.code=fromLink; lsSet('hfs-code',fromLink); try{ history.replaceState(null,'',location.pathname); }catch(e){} }
else { var savedCode=lsGet('hfs-code'); if(typeof savedCode==='string') S.code=cleanCode(savedCode); }
var cfg=window.HFS_FIREBASE;
if(!cfg||!cfg.projectId||!window.firebase){ S.noDb=true; S.noDbMsg=cfg&&cfg.projectId?'':'This app is not connected to its database yet.'; render(); }
else { firebase.initializeApp(cfg); db=firebase.firestore(); if(S.code) connect(); else render(); }
})();
</script>
</body>
</html>
